server {
    listen 80;
    charset utf-8;
    access_log off;
    client_max_body_size 50M;

    resolver 127.0.0.11;
    set $w_client http://wise-client:4200;
    set $w_api http://wise-api:8080;

    # Shared proxy headers
    proxy_set_header Host $host:$server_port;
    proxy_set_header X-Forwarded-Host $server_name;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    location /sockjs-node {
        proxy_pass $w_client;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /websocket {
        proxy_pass $w_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ /(api|oauth2|run-survey|(student|teacher)/account/info|curriculum/(?!personal|public)) {
        proxy_pass $w_api;
    }

    location ~ ^/(teacher/management|previewproject\.html|portal|admin|author/|studentuploads|projectIcons) {
        proxy_pass $w_api;
    }

    rewrite ^/wise5/(.*)$ /assets/wise5/$1 last;

    location / {
        proxy_pass $w_client;
    }

    location /static {
        expires 30d;
        alias /app/static;
    }
}
